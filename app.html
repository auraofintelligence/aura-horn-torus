<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura app · Aura Horn Torus</title>
<style>
  :root{
    --ink:#e8ebf2; --ink-soft:#939cab; --line:rgba(255,255,255,.09);
    --panel:rgba(12,14,20,.62); --accent:#d8b36a; --glow:rgba(216,179,106,.35);
    /* the app's own colours, taken off the prototype screens */
    --app-bg:#ffffff; --app-ink:#1c1c1c; --app-line:#c8c8c8; --app-soft:#6a6a6a;
    --app-grey:#808080;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
    background:radial-gradient(ellipse at 50% 14%, #12151f 0%, #05060a 72%);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;line-height:1.55}
  main{max-width:1100px;margin:0 auto;padding:32px 20px 90px}
  h1{font-size:15px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
  .site{font-size:13px;color:var(--ink-soft);margin:0 0 18px}
  .site a{color:var(--accent);text-decoration:none}
  button,input{font:500 12.5px/1.3 inherit;color:var(--ink)}
  button{padding:8px 13px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);cursor:pointer}
  button:hover{border-color:rgba(216,179,106,.45)}
  button.on{background:rgba(216,179,106,.16);color:var(--accent);border-color:rgba(216,179,106,.5)}
  input{padding:9px 12px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);width:100%}
  input::placeholder{color:var(--ink-soft)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
  .bar .grow{flex:1 1 220px;min-width:170px}

  /* ------- the stage: the app on the left, what we know about it on the right ------- */
  .stage{display:grid;grid-template-columns:392px 1fr;gap:26px;align-items:start}
  @media(max-width:900px){ .stage{grid-template-columns:1fr} }

  /* ------- the app itself, drawn the way the prototype draws it ------- */
  .phone{width:392px;max-width:100%;background:#2f2f2f;border-radius:22px;padding:16px;
    box-shadow:0 22px 60px rgba(0,0,0,.5);position:sticky;top:20px}
  @media(max-width:900px){ .phone{position:static;margin:0 auto} }
  .screen{background:var(--app-bg);border-radius:4px;overflow:hidden;
    display:flex;flex-direction:column;min-height:640px;position:relative}
  .statusbar{background:#000;color:#fff;font-size:10px;display:flex;justify-content:flex-end;
    gap:7px;align-items:center;padding:4px 9px;letter-spacing:.02em;flex:0 0 auto}
  .statusbar .dot{opacity:.85}
  .appbody{flex:1 1 auto;padding:16px 14px 8px;color:var(--app-ink);
    display:flex;flex-direction:column;position:relative}
  .qs{position:absolute;top:8px;right:10px;width:44px;z-index:2}
  .qs img{width:100%;display:block}
  .apptitle{font-size:24px;line-height:1.2;text-align:center;font-weight:400;
    color:var(--app-ink);margin:6px 26px 12px;letter-spacing:-.01em}
  .apptitle.small{font-size:19px}
  .hero{display:flex;justify-content:center;margin:2px 0 14px}
  .hero img{max-width:60%;max-height:132px;object-fit:contain}
  .appnote{font-size:12px;color:var(--app-ink);text-align:center;margin:0 6px 14px;line-height:1.5}
  .rows{display:flex;flex-direction:column;gap:8px;margin:0 2px}
  .rows.boxed{border:1px solid var(--app-line);border-radius:4px;padding:9px;gap:7px}
  .rw{border:1px solid var(--app-line);border-radius:5px;background:#fff;color:var(--app-ink);
    padding:9px 11px;font-size:12.5px;text-align:left;cursor:pointer;text-decoration:none;
    display:flex;align-items:center;gap:9px;line-height:1.35}
  .rw:hover{border-color:#8a8a8a;background:#fafafa}
  .rw.centre{justify-content:center;text-align:center}
  .rw img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
  .rw .chev{margin-left:auto;color:#b0b0b0;font-size:14px}
  .rw.flat{cursor:default}
  .rw.flat:hover{border-color:var(--app-line);background:#fff}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px}
  .g3{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;
    border-radius:8px;cursor:pointer;text-decoration:none;color:var(--app-ink);font-size:10.5px;
    text-align:center;line-height:1.3}
  .g3:hover{background:#f2f2f2}
  .g3 img{width:52px;height:52px;object-fit:contain}
  .g3 .ph{width:52px;height:52px;border:1px solid var(--app-line);border-radius:8px}
  .appfoot{display:flex;align-items:center;justify-content:space-around;
    padding:12px 18px 16px;flex:0 0 auto}
  .nav{background:none;border:0;padding:6px;cursor:pointer;line-height:0}
  .nav svg{width:34px;height:34px;fill:var(--app-grey)}
  .nav:disabled{opacity:.22;cursor:default}
  .homebar{height:5px;width:110px;background:#d5d5d5;border-radius:3px;margin:0 auto 10px}
  body.editing .hero img, body.editing .rw img, body.editing .g3 img,
  body.editing .g3 .ph{outline:2px dashed rgba(216,179,106,.9);outline-offset:2px;cursor:pointer}

  /* ------- the panel beside it: what the app itself does not carry ------- */
  aside section{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:17px;margin:0 0 15px}
  aside h2{font-size:13.5px;margin:0 0 3px}
  aside .sub{font-size:11.5px;color:var(--ink-soft);margin:0 0 11px}
  .trail{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;margin:0 0 14px}
  .trail a{color:var(--accent);text-decoration:none;cursor:pointer}
  .trail span.sep,.trail span.here{color:var(--ink-soft)}
  .addrs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:520px){ .addrs{grid-template-columns:1fr} }
  .addr{display:flex;flex-direction:column;gap:2px;padding:12px 13px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.02);text-decoration:none;color:var(--ink)}
  .addr:hover{border-color:rgba(216,179,106,.5)}
  .addr .t{font-size:9.5px;color:var(--ink-soft);letter-spacing:.09em;text-transform:uppercase}
  .addr .a{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--accent);margin:2px 0}
  .addr.in{border-left:2px solid rgba(216,179,106,.55)}
  .addr.out{border-left:2px solid rgba(140,170,220,.5)}
  .addr.out .a{color:#9dbbe8}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .lk{padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.02);font-size:11px;color:var(--ink-soft);cursor:pointer;text-decoration:none}
  .lk:hover{border-color:rgba(216,179,106,.45);color:var(--ink)}
  .note{font-size:11px;color:var(--ink-soft);line-height:1.55;margin:10px 0 0}
  .shots{display:flex;gap:10px;flex-wrap:wrap}
  .shots img{width:118px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}

  /* icon picker */
  .sheet{position:fixed;inset:0;background:rgba(3,4,7,.72);backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .sheet[hidden]{display:none}
  .sheet .inner{width:100%;max-width:720px;max-height:86vh;overflow:auto;background:#0b0d13;
    border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px 30px}
  .sheet h3{font-size:14px;margin:0 0 3px}
  .sheet .sub{font-size:11.5px;color:var(--ink-soft);margin:0 0 12px}
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin:12px 0 0}
  .pick .p{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);
    padding:9px 4px 7px;text-align:center;cursor:pointer}
  .pick .p:hover{border-color:rgba(216,179,106,.5)}
  .pick .p img{max-width:100%;max-height:42px}
  .pick .p .t{font-size:9px;color:var(--ink-soft);margin-top:5px;line-height:1.3}
  .prompt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0 0;white-space:pre-wrap;
    word-break:break-word;max-height:130px;overflow:auto}
  .empty{font-size:12px;color:var(--ink-soft);padding:18px 0;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Aura</h1>
  <p class="site"><a href="index.html">← demo</a> · <a href="icons.html">icon library</a> ·
     <a href="tables.html">tables</a> · <a href="geometry.html">geometry</a> · <a href="about.html">about</a></p>

  <div class="bar">
    <span class="grow"><input id="q" placeholder="Search the whole app"></span>
    <button id="editBtn">Edit icons</button>
    <button id="origBtn">Show the original</button>
    <button id="homeBtn">Home</button>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="statusbar"><span class="dot">▮▮▯</span><span class="dot">▰</span><span>02:18 PM</span></div>
        <div class="appbody" id="appbody"></div>
        <div class="appfoot" id="appfoot"></div>
        <div class="homebar"></div>
      </div>
    </div>

    <aside id="aside"></aside>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="inner">
    <h3 id="pkName">Choose an icon</h3>
    <p class="sub" id="pkPath"></p>
    <div class="bar">
      <span class="grow"><input id="pkQ" placeholder="Search the icon library"></span>
      <button id="pkUpload">Upload</button>
      <button id="pkClear">Use the default</button>
      <button id="pkClose">Done</button>
      <input id="pkFile" type="file" accept="image/*" hidden>
    </div>
    <div class="pick" id="pkGrid"></div>
    <div class="prompt" id="pkPrompt" hidden></div>
    <div class="bar" style="margin-top:10px">
      <button id="pkCopy" hidden>Copy this prompt</button>
      <a class="site" href="icons.html" style="margin:0 0 0 4px">open the full icon library →</a>
    </div>
  </div>
</div>

<script src="assets/pages.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/relations.js"></script>
<script src="assets/holds.js"></script>
<script>
(function(){
  var PAGES   = (window.AURA_PAGES && window.AURA_PAGES.sections) || [];
  var ICONS   = (window.AURA_ICONS && window.AURA_ICONS.icons) || [];
  var ASSIGN  = (window.AURA_ICONS && window.AURA_ICONS.assign) || {};
  var HOW     = (window.AURA_ICONS && window.AURA_ICONS.assignBy) || {};
  var SCREENS = (window.AURA_ICONS && window.AURA_ICONS.screens) || {};
  var SCRDIR  = (window.AURA_ICONS && window.AURA_ICONS.screenDir) || 'assets/screens/';
  var REL     = window.AURA_REL || {shells:[], registers:{}, related:{}, note:''};
  var HOLDS   = (window.AURA_HOLDS && window.AURA_HOLDS.pages) || {};
  var KEY = 'aura.app.icons.v2';
  var mine = load(), editing = false, showOrig = false;

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(mine)); }catch(e){} }
  function el(id){ return document.getElementById(id); }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  var byId = {}; ICONS.forEach(function(i){ byId[i.id] = i; });

  /* An icon only stands in for a page if it was actually cut from that page.
     A guess by wording is not good enough to put on the app itself: it is
     offered in the panel beside instead, where it can be labelled as a guess. */
  function realIcon(key){
    var c = mine[key];
    if(c) return {src:c, mine:true};
    var id = ASSIGN[key];
    if(id && byId[id] && (HOW[key] === 'screen' || HOW[key] === 'child'))
      return {src:byId[id].file, mine:false, ic:byId[id]};
    return null;
  }

  /* ---------------- routing ---------------- */
  function route(){
    var h = (location.hash || '').replace(/^#\/?/, '');
    return h ? h.split('/').filter(Boolean) : [];
  }
  function go(parts){ location.hash = parts.length ? '#/' + parts.join('/') : ''; }

  function resolve(parts){
    var root = {key:'', name:'Aura', kind:'root', trail:[], parent:null,
      children:PAGES.map(function(s){ return {key:s.slug, name:s.name, n:s.groups.length}; })};
    var S = PAGES.filter(function(x){ return x.slug === parts[0]; })[0];
    if(!S) return root;

    var node = {key:S.slug, name:S.name, kind:'section', parent:'', trail:[[S.name, S.slug]],
      children:S.groups.map(function(g){
        return {key:S.slug + '/' + g.slug, name:g.name, n:g.pages.length + (g.more || []).length}; })};
    var G = S.groups.filter(function(x){ return x.slug === parts[1]; })[0];
    if(!G) return node;

    var gk = S.slug + '/' + G.slug;
    node = {key:gk, name:G.name, kind:'group', parent:S.slug, trail:[[S.name, S.slug], [G.name, gk]],
      children:G.pages.map(function(p){ return {key:gk + '/' + p.slug, name:p.name, n:p.items.length}; })
        .concat((G.more || []).map(function(it){
          return {key:gk + '/more/' + slug(it), name:it, n:0}; }))};
    if(!parts[2]) return node;

    if(parts[2] === 'more'){
      var mi = (G.more || []).filter(function(it){ return slug(it) === parts[3]; })[0];
      if(!mi) return node;
      var mk = gk + '/more/' + slug(mi);
      return {key:mk, name:mi, kind:'entry', parent:gk, children:[],
        trail:[[S.name, S.slug], [G.name, gk], [mi, mk]]};
    }
    var P = G.pages.filter(function(x){ return x.slug === parts[2]; })[0];
    if(!P) return node;

    var pk = gk + '/' + P.slug;
    node = {key:pk, name:P.name, kind:'page', parent:gk, trail:[[S.name, S.slug], [G.name, gk], [P.name, pk]],
      children:P.items.map(function(it){ return {key:pk + '/' + slug(it), name:it, n:0}; })};
    if(!parts[3]) return node;

    var it = P.items.filter(function(x){ return slug(x) === parts[3]; })[0];
    if(!it) return node;
    var ik = pk + '/' + slug(it);
    return {key:ik, name:it, kind:'entry', parent:pk, children:[],
      trail:[[S.name, S.slug], [G.name, gk], [P.name, pk], [it, ik]]};
  }

  /* ---------------- the app screen ---------------- */
  var ARROWS = {
    back:'M20 6 L8 17 L20 28 M8 17 L30 17',
    down:'M6 14 L17 26 L28 14 M17 26 L17 4',
    up:'M6 20 L17 8 L28 20 M17 8 L17 30'
  };
  function navBtn(dir, title, fn, off){
    var b = document.createElement('button');
    b.className = 'nav'; b.title = title; b.disabled = !!off;
    b.innerHTML = '<svg viewBox="0 0 36 36"><path d="' + ARROWS[dir] + '" fill="none" stroke="' +
      '#808080" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter"/></svg>';
    if(!off) b.onclick = fn;
    return b;
  }

  function iconTag(key, name, cls){
    var r = realIcon(key);
    if(r) return '<img alt="' + esc(name) + '" loading="lazy" src="' + r.src + '" data-key="' +
                 esc(key) + '" data-name="' + esc(name) + '">';
    return '<span class="' + (cls || 'ph') + '" data-key="' + esc(key) + '" data-name="' + esc(name) + '"></span>';
  }

  function renderApp(node){
    var body = el('appbody'), foot = el('appfoot');
    body.innerHTML = ''; foot.innerHTML = '';

    if(showOrig){
      var shots = SCREENS[node.key] || [];
      if(shots.length){
        body.innerHTML = '<div style="padding:0;margin:-16px -14px -8px">' +
          shots.map(function(s){ return '<img alt="" style="width:100%;display:block" src="' +
            SCRDIR + s + '.webp">'; }).join('') + '</div>';
      } else {
        body.innerHTML = '<p class="appnote" style="margin-top:60px;color:#6a6a6a">' +
          'No prototype screen was drawn for this page.</p>';
      }
      foot.appendChild(navBtn('back', 'Back', function(){
        go(node.trail.length > 1 ? node.trail[node.trail.length - 2][1].split('/') : []); },
        node.kind === 'root'));
      return;
    }

    /* the QUICK START badge sits on almost every screen in the prototype */
    var qs = byId[Object.keys(byId).filter(function(k){ return /quick start/i.test(byId[k].name); })[0]];
    if(qs && node.kind !== 'root')
      body.insertAdjacentHTML('beforeend', '<div class="qs"><img alt="Quick start" src="' + qs.file + '"></div>');

    body.insertAdjacentHTML('beforeend',
      '<p class="apptitle' + (node.name.length > 24 ? ' small' : '') + '">' + esc(node.name) + '</p>');

    var ic = realIcon(node.key);
    if(ic) body.insertAdjacentHTML('beforeend',
      '<div class="hero">' + iconTag(node.key, node.name) + '</div>');

    var held = HOLDS[node.key];
    if(held && held.body)
      body.insertAdjacentHTML('beforeend', '<p class="appnote">' + esc(held.body) + '</p>');

    /* children become the buttons, exactly as the prototype lays them out.
       With no children, whatever the page holds is listed instead. */
    var kids = node.children || [];
    if(kids.length){
      var withArt = kids.filter(function(k){ return realIcon(k.key); }).length;
      if(withArt >= Math.max(3, kids.length * 0.6) && kids.length >= 4){
        var g = document.createElement('div'); g.className = 'grid3';
        kids.forEach(function(k){
          var a = document.createElement('a');
          a.className = 'g3'; a.href = 'javascript:void(0)';
          a.innerHTML = iconTag(k.key, k.name) + '<span>' + esc(k.name) + '</span>';
          a.onclick = function(e){ tap(e, k.key, k.name); };
          g.appendChild(a);
        });
        body.appendChild(g);
      } else {
        var rows = document.createElement('div');
        rows.className = 'rows' + (kids.length > 5 ? ' boxed' : '');
        kids.forEach(function(k){
          var a = document.createElement('a');
          a.className = 'rw' + (kids.length <= 5 ? ' centre' : '');
          a.href = 'javascript:void(0)';
          var r = realIcon(k.key);
          a.innerHTML = (r ? iconTag(k.key, k.name) : '') + '<span>' + esc(k.name) + '</span>' +
                        (k.n ? '<span class="chev">›</span>' : '');
          a.onclick = function(e){ tap(e, k.key, k.name); };
          rows.appendChild(a);
        });
        body.appendChild(rows);
      }
    } else if(held && held.rows.length){
      var rw = document.createElement('div');
      rw.className = 'rows' + (held.rows.length > 5 ? ' boxed' : '');
      var CAP = 14;
      held.rows.slice(0, CAP).forEach(function(t){
        var d = document.createElement('div');
        d.className = 'rw flat'; d.innerHTML = '<span>' + esc(t) + '</span>';
        rw.appendChild(d);
      });
      body.appendChild(rw);
      if(held.rows.length > CAP)
        body.insertAdjacentHTML('beforeend',
          '<p class="appnote" style="margin-top:12px;color:#6a6a6a;font-size:11px">and ' +
          (held.rows.length - CAP) + ' more, listed beside</p>');
    } else if(node.kind !== 'root'){
      body.insertAdjacentHTML('beforeend',
        '<p class="appnote" style="color:#6a6a6a">This page is named in the workbook and has not been ' +
        'designed yet.</p>');
    }

    /* the prototype puts a back arrow at the foot, and a down arrow to go on */
    foot.appendChild(navBtn('back', 'Back', function(){
      go(node.trail.length > 1 ? node.trail[node.trail.length - 2][1].split('/') : []); },
      node.kind === 'root'));
    var first = (node.children || [])[0];
    foot.appendChild(navBtn('down', 'Go in', function(){ go(first.key.split('/')); }, !first));
  }

  function tap(e, key, name){
    var img = e.target.closest && (e.target.closest('img') || e.target.closest('.ph'));
    if(editing && img){ e.preventDefault(); openPicker(key, name); return; }
    go(key.split('/'));
  }

  /* ---------------- the panel beside the app ---------------- */
  function renderAside(node){
    var a = el('aside'); a.innerHTML = '';

    var t = document.createElement('div'); t.className = 'trail';
    var crumbs = [['Aura', []]].concat(node.trail.map(function(c){ return [c[0], c[1].split('/')]; }));
    crumbs.forEach(function(c, i){
      if(i) t.insertAdjacentHTML('beforeend', '<span class="sep">›</span>');
      if(i === crumbs.length - 1) t.insertAdjacentHTML('beforeend', '<span class="here">' + esc(c[0]) + '</span>');
      else { var lk = document.createElement('a'); lk.textContent = c[0];
             lk.onclick = function(){ go(c[1]); }; t.appendChild(lk); }
    });
    a.appendChild(t);

    if(node.kind === 'root'){
      a.insertAdjacentHTML('beforeend',
        '<section><h2>The app</h2><p class="sub">Drawn the way the prototype draws it</p>' +
        '<p class="note">Eight sections and every name beneath them, from the Aura workbook page list. ' +
        'Tap through on the left. This panel carries what the app itself does not: where each page would ' +
        'sit on the lattice, what it relates to elsewhere, and where its icon came from.</p></section>');
      return;
    }

    /* where the icon came from, said plainly */
    var id = ASSIGN[node.key], ic = id && byId[id], how = HOW[node.key];
    var s1 = document.createElement('section');
    s1.innerHTML = '<h2>This page’s icon</h2><p class="sub">' +
      (mine[node.key] ? 'Yours' :
       how === 'screen' ? 'Cut from this page’s own prototype screen' :
       how === 'child'  ? 'Borrowed from a page beneath this one' :
       ic ? 'Only a guess, so the app is not using it' : 'None') + '</p>' +
      (ic ? '<p class="note"><b>' + esc(ic.name) + '.</b> ' + esc(ic.desc) + '</p>' : '') +
      (how === 'name' && ic ? '<p class="note">Matched by wording alone. The app leaves the space empty ' +
        'rather than show a guess. Turn on Edit icons to set it yourself, or take this one.</p>' : '') +
      (!ic && !mine[node.key] ? '<p class="note">No icon was drawn for this page. Turn on Edit icons and ' +
        'tap the empty square to choose or generate one.</p>' : '');
    var row = document.createElement('div'); row.className = 'links'; row.style.marginTop = '10px';
    var eb = document.createElement('a'); eb.className = 'lk'; eb.href = 'javascript:void(0)';
    eb.textContent = mine[node.key] ? 'Change this icon' : 'Choose an icon';
    eb.onclick = function(){ openPicker(node.key, node.name); };
    row.appendChild(eb);
    if(how === 'name' && ic){
      var tk = document.createElement('a'); tk.className = 'lk'; tk.href = 'javascript:void(0)';
      tk.textContent = 'Use the guess anyway';
      tk.onclick = function(){ mine[node.key] = ic.file; save(); render(); };
      row.appendChild(tk);
    }
    s1.appendChild(row);
    a.appendChild(s1);

    /* the address on the lattice */
    var rg = REL.registers[node.key];
    if(rg){
      var k = REL.shells.indexOf(rg.shell) + 1;
      var pad = function(n){ return ('00' + n).slice(-3); };
      var span = rg.n === 1 ? pad(rg.from) : pad(rg.from) + ' to ' + pad(rg.to);
      a.insertAdjacentHTML('beforeend',
        '<section><h2>Where it lives</h2><p class="sub">' + rg.n + (rg.n === 1 ? ' facet' : ' facets') +
        ' on the ' + rg.shell.toLowerCase() + ' torus</p><div class="addrs">' +
        '<a class="addr in" href="index.html#addr=' + k + ',' + rg.from + ',in">' +
          '<span class="t">Interior, personal</span><span class="a">' + rg.shell + ' I-' + span + '</span>' +
          '<span class="t">private encrypted</span></a>' +
        '<a class="addr out" href="index.html#addr=' + k + ',' + rg.from + ',out">' +
          '<span class="t">Exterior, observer</span><span class="a">' + rg.shell + ' O-' + span + '</span>' +
          '<span class="t">public permissioned</span></a></div>' +
        '<p class="note">Same facet numbers on both faces, and the letter says which register you are reading. ' +
        esc(REL.note) + '</p></section>');
    }

    /* everything the page holds, in full, where the screen only had room for some */
    var held = HOLDS[node.key];
    if(held && held.rows.length > 14){
      var hs = document.createElement('section');
      hs.innerHTML = '<h2>Everything it holds</h2><p class="sub">' + held.rows.length +
        ' entries, transcribed from the prototype</p>';
      var box = document.createElement('div'); box.className = 'links';
      held.rows.forEach(function(r){
        var sp = document.createElement('span'); sp.className = 'lk';
        sp.style.cursor = 'default'; sp.textContent = r; box.appendChild(sp);
      });
      hs.appendChild(box); a.appendChild(hs);
    }

    /* what it relates to elsewhere */
    var rl = REL.related[node.key];
    if(rl && rl.length){
      var rs = document.createElement('section');
      rs.innerHTML = '<h2>Related elsewhere</h2><p class="sub">Pages that share a distinctive word with this one</p>';
      var ln = document.createElement('div'); ln.className = 'links';
      rl.forEach(function(x){
        var b = document.createElement('a'); b.className = 'lk'; b.href = 'javascript:void(0)';
        b.textContent = x.name + (x.where ? '  ·  ' + x.where : '');
        b.onclick = function(){ go(x.key.split('/')); };
        ln.appendChild(b);
      });
      rs.appendChild(ln); a.appendChild(rs);
    }

    /* the original screens */
    var shots = SCREENS[node.key] || [];
    if(shots.length){
      var ss = document.createElement('section');
      ss.innerHTML = '<h2>Drawn in the prototype</h2><p class="sub">' + shots.length +
        (shots.length === 1 ? ' screen' : ' screens') + ' for this page</p>';
      var sr = document.createElement('div'); sr.className = 'shots';
      shots.forEach(function(s){
        var im = document.createElement('img');
        im.loading = 'lazy'; im.src = SCRDIR + s + '.webp'; im.alt = 'Prototype screen ' + s;
        im.title = s + ' · tap to show it on the phone';
        im.onclick = function(){ showOrig = true; el('origBtn').classList.add('on');
          el('origBtn').textContent = 'Show the rebuild'; render(); };
        sr.appendChild(im);
      });
      ss.appendChild(sr); a.appendChild(ss);
    }
  }

  function render(){
    var node = resolve(route());
    renderApp(node);
    renderAside(node);
  }

  /* ---------------- search ---------------- */
  function search(q){
    q = q.toLowerCase(); var hits = [];
    PAGES.forEach(function(S){
      if(S.name.toLowerCase().indexOf(q) >= 0) hits.push({k:S.slug, n:S.name, w:'section'});
      S.groups.forEach(function(G){
        var gk = S.slug + '/' + G.slug;
        if(G.name.toLowerCase().indexOf(q) >= 0) hits.push({k:gk, n:G.name, w:S.name});
        G.pages.forEach(function(P){
          var pk = gk + '/' + P.slug;
          if(P.name.toLowerCase().indexOf(q) >= 0) hits.push({k:pk, n:P.name, w:S.name + ' · ' + G.name});
          P.items.forEach(function(it){
            if(it.toLowerCase().indexOf(q) >= 0)
              hits.push({k:pk + '/' + slug(it), n:it, w:G.name + ' · ' + P.name});
          });
        });
        (G.more || []).forEach(function(it){
          if(it.toLowerCase().indexOf(q) >= 0)
            hits.push({k:gk + '/more/' + slug(it), n:it, w:S.name + ' · ' + G.name});
        });
      });
    });
    return hits;
  }
  el('q').oninput = function(){
    var q = this.value.trim();
    if(!q){ render(); return; }
    var hits = search(q), body = el('appbody'), foot = el('appfoot');
    body.innerHTML = '<p class="apptitle small">Search</p>'; foot.innerHTML = '';
    var rows = document.createElement('div'); rows.className = 'rows boxed';
    hits.slice(0, 30).forEach(function(h){
      var a = document.createElement('a'); a.className = 'rw'; a.href = 'javascript:void(0)';
      var r = realIcon(h.k);
      a.innerHTML = (r ? '<img alt="" src="' + r.src + '">' : '') + '<span>' + esc(h.n) + '</span>';
      a.onclick = function(){ el('q').value = ''; go(h.k.split('/')); };
      rows.appendChild(a);
    });
    if(!hits.length) rows.innerHTML = '<p class="appnote" style="color:#6a6a6a">Nothing matches that.</p>';
    body.appendChild(rows);
    if(hits.length > 30) body.insertAdjacentHTML('beforeend',
      '<p class="appnote" style="font-size:11px;color:#6a6a6a">' + hits.length + ' matches, showing 30</p>');
    el('aside').innerHTML = '<section><h2>Search</h2><p class="sub">' + hits.length +
      ' matches across the whole directory</p></section>';
  };

  /* ---------------- icon picker ---------------- */
  var pkKey = null;
  function openPicker(key, name){
    pkKey = key;
    el('pkName').textContent = name;
    el('pkPath').textContent = key.split('/').join(' › ');
    el('pkQ').value = ''; drawPick('');
    var id = ASSIGN[key], ic = id && byId[id];
    el('pkPrompt').hidden = !ic; el('pkCopy').hidden = !ic;
    if(ic) el('pkPrompt').textContent = (ic.prompt || '').replace('{STYLE}', 'in my own style');
    el('sheet').hidden = false;
  }
  function drawPick(q){
    q = q.toLowerCase();
    var list = ICONS.filter(function(i){
      return !q || (i.name + ' ' + (i.desc || '') + ' ' + (i.category || '')).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 96);
    var g = el('pkGrid'); g.innerHTML = '';
    list.forEach(function(i){
      var d = document.createElement('div'); d.className = 'p';
      d.innerHTML = '<img loading="lazy" alt="" src="' + i.file + '"><div class="t">' + esc(i.name) + '</div>';
      d.onclick = function(){ mine[pkKey] = i.file; save(); render(); el('sheet').hidden = true; };
      g.appendChild(d);
    });
    if(!list.length) g.innerHTML = '<p class="empty">No icon in the library matches that.</p>';
  }
  el('pkQ').oninput = function(){ drawPick(this.value.trim()); };
  el('pkUpload').onclick = function(){ el('pkFile').click(); };
  el('pkFile').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ mine[pkKey] = r.result; save(); render(); el('sheet').hidden = true; };
    r.readAsDataURL(f); e.target.value = '';
  };
  el('pkClear').onclick = function(){ delete mine[pkKey]; save(); render(); el('sheet').hidden = true; };
  el('pkClose').onclick = function(){ el('sheet').hidden = true; };
  el('sheet').onclick = function(e){ if(e.target === this) this.hidden = true; };
  el('pkCopy').onclick = function(){
    var t = el('pkPrompt').textContent, b = this;
    var done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy this prompt'; }, 1300); };
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(done, done); else done();
  };

  el('editBtn').onclick = function(){
    editing = !editing;
    document.body.classList.toggle('editing', editing);
    this.classList.toggle('on', editing);
    this.textContent = editing ? 'Done editing' : 'Edit icons';
  };
  el('origBtn').onclick = function(){
    showOrig = !showOrig;
    this.classList.toggle('on', showOrig);
    this.textContent = showOrig ? 'Show the rebuild' : 'Show the original';
    render();
  };
  el('homeBtn').onclick = function(){ el('q').value = ''; location.hash = ''; render(); };
  window.addEventListener('hashchange', render);

  if(!PAGES.length) el('appbody').innerHTML = '<p class="empty">The directory data file is missing.</p>';
  else render();
})();
</script>
</body>
</html>
